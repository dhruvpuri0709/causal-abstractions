[project]
name = "causal-abstraction-statistics"
version = "0.1.0"
description = "Type I error and power of IIA-based certification under DAS"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pyvene==0.1.8",
    "torch>=2.2",
    "numpy",
    "scipy",
    "pandas",
    "statsmodels",
    "matplotlib",
    "tqdm",
    "pyyaml",
]

[project.scripts]
cas = "cas.cli:main"

[dependency-groups]
dev = ["jupyter", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cas"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: slow cross-checks (deselect with -m 'not slow')"]
addopts = "-m 'not slow'"
