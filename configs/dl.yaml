# Distributive law only: the DL part of configs/full.yaml, same settings as configs/he.yaml.
# Two algorithms (and_or_and, and_or): IIT nets toward one are wrong-algorithm negatives for the other.
# Outputs go to results/dl/.
name: dl
seed: 20261105          # same seed as full.yaml, so network ids/seeds match the full run
results_dir: results

tasks:
  distributive_law: {widths: [24, 48, 96]}

network:
  n_layers: 3
  iit_layer: 1        # IIT site L* (0-based hidden layer) = the pre-registered DAS site
  iit_k_frac: 0.25    # k* = 0.25 x width per variable (V1 in neurons [0,k*), V2 in [k*,2k*))

networks:             # per width; IIT counts are per algorithm
  eval: {iit: 30, random: 30, standard: 10}
  calibration: {random: 39, iit: 39}   # random null + wrong-algorithm (oracle) null

train:
  standard: {lr: 0.001, batch_size: 1024, max_steps: 20000, eval_every: 250, eval_n: 4000,
             target_acc: 0.995, pass_acc: 0.99}
  iit: {lr: 0.001, batch_size: 1024, max_steps: 20000, eval_every: 250, eval_n: 4000,
        target_acc: 0.995, target_iit_acc: 0.99, pass_acc: 0.99, pass_iit_acc: 0.98}

das:
  layers: [0, 1, 2]
  k_fracs: [0.125, 0.25, 0.5]
  seeds: 3
  n_fit: [256, 1024, 4096]
  n_select: 1024
  n_test: 1024
  base_uses: 2
  source_uses: 2
  fit: {lr: 0.01, batch_size: 128, max_steps: 4000, window: 50, patience: 5, tol: 0.001,
        min_loss: 0.001}

"null":                 # quoted: a bare `null:` key is parsed by YAML as None and ignored
  shuffle_B: 0          # shuffled-label null dropped for speed (was 39); P3_null_shuffled is empty

analysis:
  threshold: 0.9
  thresholds: [0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 0.99, 1.0]
  alpha: 0.05
  bootstrap_B: 2000
